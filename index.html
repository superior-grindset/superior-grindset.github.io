<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superior Grindset</title>
<meta name="description" content="Superior Grindset — mashqlar, ovqatlanish va foydali fitness ma'lumotlari o'zbek tilida.">
<meta property="og:title" content="Superior Grindset">
<meta property="og:description" content="Mashq videolari, texnika, ovqatlanish va foydali ma'lumotlar — o'zbek tilida.">
<meta property="og:image" content="https://superior-grindset.github.io/bilim.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23e3241b%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Impact,Arial%27 font-size=%2732%27 fill=%27white%27 text-anchor=%27middle%27%3ESG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<style>
:root{
  --paper:#f2efe9; --paper-2:#e8e3d9; --ink:#0b0b0b; --ink-2:#2a2826; --mut:#6d6860;
  --red:#e3241b; --red-d:#b81a13;
  --display:"Anton",Impact,"Arial Narrow",sans-serif; --dw:400;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--paper)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:var(--dw);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.logo i{font-style:normal;background:var(--red);color:#fff;padding:2px 7px}
.links{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.links a{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-decoration:none;color:#bdb8ae;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent}
.links a:hover{color:#fff}
.links a.on{color:#fff;border-bottom-color:var(--red)}
.navbtn{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;text-decoration:none;background:var(--red);color:#fff;padding:9px 14px}
@media (max-width:600px){.logo span{display:none}.nav .wrap{gap:10px}.links a{padding:10px 8px;font-size:12px}.links a:first-child{display:none}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:14px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.o{background:transparent;color:var(--ink)}
.btn.o:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* HERO */
.hero{position:relative;overflow:hidden;border-bottom:3px solid var(--ink)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:stretch;padding-top:40px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-top:0}}
.hero .txt{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-bottom:40px}
.kicker{font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:var(--red)}
.hero h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(68px,12.5vw,168px);line-height:.84;letter-spacing:-.005em}
.skew{display:inline-block;background:var(--red);color:var(--paper);padding:0 .08em;transform:skewX(-8deg)}
.hero p{margin:0;max-width:40ch;font-size:18px;font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.hero .shot{min-height:520px;background:#111 center 25%/cover no-repeat;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}
@media (max-width:820px){.hero .shot{min-height:400px;order:-1;margin-inline:-16px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:44px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.stats div span{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px}

.marq{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;font-family:var(--display);font-weight:var(--dw);font-size:24px;letter-spacing:.06em;padding:12px 0;text-transform:uppercase}
.marq div{display:inline-block;animation:mq 26s linear infinite}
.marq em{font-style:normal;color:var(--red);margin:0 18px}
@keyframes mq{to{transform:translateX(-50%)}}

/* SECTIONS */
main{padding-block:44px 80px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:10px}
h2.t{font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(34px,6vw,56px);line-height:.95;margin:0}
.sub{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--mut)}
.more{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--red);text-decoration:none}
.more:hover{text-decoration:underline}

.search{width:100%;max-width:620px;background:#fff;border:2px solid var(--ink);color:var(--ink);padding:14px 18px;font:600 16px var(--body)}
.search:focus{outline:none;border-color:var(--red)}
.res{display:flex;flex-direction:column;border:2px solid var(--ink);max-width:620px;background:#fff}
.res a{display:flex;justify-content:space-between;gap:12px;padding:13px 18px;text-decoration:none;border-top:1px solid #d8d3c9}
.res a:first-child{border-top:0}
.res a:hover{background:var(--paper-2)}
.res b{font-family:var(--display);font-weight:var(--dw);font-size:20px;text-transform:uppercase}
.res span{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);align-self:center;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:1fr}.tile{min-height:130px}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:180px;padding:18px 20px 24px;background:var(--ink);color:var(--paper);text-decoration:none;overflow:hidden;transition:transform .2s}
.tile:hover{transform:translateY(-4px)}
.tile::after{content:"";position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--red);transition:height .2s}
.tile:hover::after{height:12px}
.tile .top{display:flex;justify-content:space-between;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#a9a59d;position:relative}
.tile .top span:last-child{color:var(--red);font-size:16px}
.tile .nm{font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(36px,4.2vw,58px);line-height:.9;position:relative;overflow-wrap:anywhere}
.tile .uz{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#a9a59d;position:relative;margin-top:6px}
.tile .ghost{position:absolute;right:-6px;bottom:-34px;font-family:var(--display);font-weight:var(--dw);font-size:180px;line-height:1;color:transparent;-webkit-text-stroke:1.5px #2b2a28;pointer-events:none}

.plist{display:flex;flex-direction:column;border-top:3px solid var(--ink)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;padding:20px 0;border-bottom:1px solid #cfc9bf;text-decoration:none}
.prow:hover h3{color:var(--red)}
.prow .meta{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mut)}
.prow .meta .k{color:var(--red)}
.prow h3{grid-column:1;margin:2px 0 0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(24px,3vw,34px);line-height:1;transition:color .15s}
.prow p{grid-column:1;margin:4px 0 0;color:var(--ink-2);font-size:15px}
.prow .big{grid-column:2;grid-row:1/span 3;align-self:center;text-align:right;font-family:var(--display);font-weight:var(--dw);font-size:clamp(30px,4.6vw,52px);line-height:1;color:var(--red);white-space:nowrap}
.prow .big small{display:block;font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-top:6px}
@media (max-width:560px){.prow .big{grid-column:1;grid-row:auto;text-align:left;margin-top:8px}}

.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--ink);color:var(--paper)}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.about .img{min-height:440px;background:#222 center 35%/cover no-repeat}
.about .txt{padding:36px 30px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.about .kick{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--red)}
.about h2{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(40px,6vw,68px);line-height:.92}
.about h2 em{font-style:normal;color:var(--red)}
.about p{margin:0;color:#cfc9be;max-width:44ch;font-size:17px}
.about .chain{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--display);font-weight:var(--dw);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.about .chain i{font-style:normal;color:var(--red)}

/* PAGE HEADERS */
.back{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--mut);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--red)}
.page-h{display:flex;flex-direction:column;gap:8px;border-bottom:4px solid var(--ink);padding-bottom:12px}
.page-h small{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--red)}
.page-h h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(60px,13vw,150px);line-height:.85;overflow-wrap:anywhere}
.bilim-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;align-items:end;border-bottom:4px solid var(--ink);padding-bottom:16px}
@media (max-width:720px){.bilim-head{grid-template-columns:1fr}.bilim-head .img{display:none}}
.bilim-head h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(72px,14vw,170px);line-height:.85}
.bilim-head p{margin:14px 0 0;font-weight:600;font-size:18px;max-width:40ch}
.bilim-head .img{aspect-ratio:4/5;max-height:340px;width:100%;background:#222 center 75%/cover no-repeat;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;padding:9px 16px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:#fff;border:2px solid var(--ink);text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:6px 6px 0 var(--red)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;left:12px;top:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;background:var(--paper);color:var(--ink);padding:3px 8px}
.play{width:62px;height:62px;border-radius:50%;background:var(--red);display:grid;place-items:center;position:absolute}
.play::before{content:"";margin-left:5px;border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #fff}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:26px;text-transform:uppercase;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:4px 9px;border:2px solid var(--ink);font-variant-numeric:tabular-nums}
.chip.red{background:var(--red);border-color:var(--red);color:#fff}

.detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.player{background:#000;border:2px solid var(--ink)}
.player .box{position:relative;width:100%;aspect-ratio:16/9}
.player.vertical .box{aspect-ratio:9/16;max-width:420px;max-height:80vh;margin:0 auto}
.player .box iframe,.player .box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player iframe.tg{display:block;width:100%;height:520px;border:0;background:#fff}
.player .err{padding:40px 20px;text-align:center;color:#bbb}
.side{display:flex;flex-direction:column;gap:18px}
.side .kick{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--red)}
.side h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(44px,6vw,72px);line-height:.9}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);background:#fff}
.specs div{padding:12px 14px;border-right:2px solid var(--ink)}
.specs div:last-child{border-right:0}
.specs b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.specs span{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mut)}
.text{white-space:pre-line;margin:0;max-width:66ch;font-size:17px}

.article{max-width:780px}
.article h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(46px,8vw,92px);line-height:.92}
.article .meta{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--red)}
.stat-hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:14px 0}
.stat-hero b{font-family:var(--display);font-weight:var(--dw);font-size:clamp(56px,10vw,96px);line-height:1;color:var(--red)}
.stat-hero span{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.article .text{font-size:18px;line-height:1.7}


.cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:22px 24px;max-width:780px}
.cta b{font-family:var(--display);font-weight:var(--dw);font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.cta p{margin:2px 0 0;color:#bdb8ae;font-weight:600;font-size:16px}

.empty{border:2px dashed #b9b3a8;padding:28px;text-align:center;color:var(--mut)}
footer{background:var(--ink);color:#bdb8ae;padding-block:26px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
footer b{font-family:var(--display);font-weight:var(--dw);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper)}
footer a{color:var(--paper)}
.loading{color:var(--mut);padding-block:60px}


/* video manbalari */
.srctabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--ink)}
@media (max-width:640px){.srctabs{grid-template-columns:1fr}}
.srctab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;background:transparent;border:0;border-right:2px solid var(--ink);cursor:pointer;color:var(--ink)}
.srctab:last-child{border-right:0}
@media (max-width:640px){.srctab{border-right:0;border-bottom:2px solid var(--ink)}.srctab:last-child{border-bottom:0}}
.srctab .n{font-family:var(--display);font-weight:var(--dw);font-size:14px;color:var(--red)}
.srctab b{font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(22px,2.6vw,30px);line-height:1}
.srctab .c{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mut)}
.srctab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.srctab[aria-selected="true"] .c{color:#bdb8ae}
.srctab:hover:not([aria-selected="true"]){background:var(--paper-2)}
.srcdesc{margin:0;font-weight:600;font-size:17px;max-width:60ch}
.src{position:absolute;right:12px;top:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:11px;padding:3px 8px}
.src-trainer{background:#fff;color:var(--ink)}
.src-premium{background:var(--red);color:#fff}
.src-gym{background:var(--ink);color:var(--paper);outline:1px solid #555}
.chip.src-trainer{background:#fff;border-color:var(--ink)}
.chip.src-premium{border-color:var(--red)}
.chip.src-gym{border-color:var(--ink);outline:0}
.card .by{font-weight:700;font-size:13px;color:var(--mut);letter-spacing:.04em}
.openlink{align-self:flex-start;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--red);padding-bottom:2px}
.openlink:hover{color:var(--red)}
/* RU: Anton kirill harflarini qo'llamaydi -> Oswald */
html[lang="ru"]{--display:"Oswald","Arial Narrow",Impact,sans-serif;--dw:700}
html[lang="ru"] body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* til tugmalari */
.lang{display:flex;border:1px solid #3a3835}
.lang button{background:transparent;border:0;color:#bdb8ae;font-weight:800;font-size:11px;letter-spacing:.12em;padding:7px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]:hover{color:var(--ink)}
@media (max-width:600px){.navbtn{display:none}}
/* motivatsiya bloki */
.quote{background:var(--red);color:#fff;padding:44px 28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.quote::after{content:"1%";position:absolute;right:-10px;bottom:-60px;font-family:var(--display);font-weight:var(--dw);font-size:260px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.25);pointer-events:none}
.quote .q{font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;font-size:clamp(48px,9vw,120px);line-height:.88;position:relative;z-index:1}
.quote .q .skew{background:var(--ink);color:#fff}
.quote p{margin:0;font-weight:700;font-size:18px;max-width:46ch;position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"><div class="wrap loading">Yuklanmoqda…</div></div>
<script>
(function(){
  // ---------- TILLAR / LANGUAGES / ЯЗЫКИ ----------
  var T = {
    uz: {
      home:"Bosh sahifa", workouts:"Mashqlar", knowledge:"Bilim", channel:"Kanal",
      kicker:"O'zingdan boshla", heroA:"Hozir", heroB:"boshla.",
      heroP:"Har bir mashq videosi, texnikasi, set va takrorlari. Ovqatlanish va tiklanish bo'yicha qisqa, amaliy ma'lumotlar. Bahona yo'q.",
      seeWorkouts:"Mashqlarni ko'rish", tgChannel:"Telegram kanal",
      stMuscles:"Mushak guruhi", stVideos:"Mashq videosi", stPosts:"Foydali post",
      marquee:["O'zingdan boshla","Hozir boshla","Har kuni 1% yaxshiroq","Bahona yo'q","Intizom — bu erkinlik"],

      el("p", {class:"srcdesc", text:t("srcDesc")[cur]}),
      list.length ? el("div", {class:"cards"}, list.map(exCard)) : el("div", {class:"empty", text:t("noSrc")})
    ], 24)];
  }

  function player(emb){
    if (!emb) return el("div", {class:"player"}, [el("div", {class:"err", text:t("noVideo")})]);
    if (emb.kind === "telegram")
      return el("div", {class:"player"}, [el("iframe", {class:"tg", src:emb.src, title:"Video", scrolling:"no"})]);
    var inner = emb.kind === "file"
      ? el("video", {src:emb.src, controls:true, playsinline:true, preload:"metadata"})
      : el("iframe", {src:emb.src, title:"Video", allow:"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share", allowfullscreen:true, referrerpolicy:"strict-origin-when-cross-origin"});
    return el("div", {class:"player" + (emb.vertical ? " vertical" : "")}, [el("div", {class:"box"}, [inner])]);
  }

  function pageExercise(id){
    var e = DATA.exercises.filter(function(x){ return String(x.id) === id; })[0];
    if (!e) return pageNotFound();
    var m = MBY[e.muscle] || {name:e.muscle};
    var specs = (e.sets || e.reps || e.rest) ? el("div", {class:"specs"}, [
      el("div", null, [el("b", {text:e.sets || "—"}), el("span", {text:t("sets")})]),
      el("div", null, [el("b", {text:e.reps || "—"}), el("span", {text:t("reps")})]),
      el("div", null, [el("b", {text:e.rest || "—"}), el("span", {text:t("rest")})])
    ]) : null;
    var body = tx(e, "body");
    return [page([
      el("a", {class:"back", href:"#/m/" + e.muscle, text:"← " + m.name}),
      el("div", {class:"detail"}, [
        el("div", {class:"stack", style:"gap:10px"}, [
          player(embed(e.video)),
          el("a", {class:"openlink", href:e.video, target:"_blank", rel:"noopener", text:"↗ " + t("openPre") + ((embed(e.video) || {}).platform || "Video") + (t("openIn") ? "'" + t("openIn") : "")})
        ]),
        el("div", {class:"side"}, [el("div", {class:"kick", text:m.name + (muscleSub(e.muscle) ? " · " + muscleSub(e.muscle) : "")}), el("h1", {text:tx(e, "name")}), el("div", {class:"chips"}, [el("span", {class:"chip src-" + srcOf(e), text:t("srcTitle")[srcOf(e)]}), e.author ? el("span", {class:"chip", text:t("coach") + ": " + e.author}) : null]), specs, body ? el("p", {class:"text", text:body}) : null])
      ]),
      askBox()
    ], 24)];
  }

  function postRow(p){
    var body = tx(p, "body").replace(/\s+/g, " "), stat = tx(p, "stat");
    return el("a", {class:"prow", href:"#/post/" + encodeURIComponent(p.id)}, [
      el("div", {class:"meta"}, [el("span", {class:"k", text:catName(p.cat)}), el("span", {text:fmtDate(p.date)})]),
      el("h3", {text:tx(p, "title")}),
      el("p", {text: body.slice(0, 130) + (body.length > 130 ? "…" : "")}),
      stat ? el("div", {class:"big"}, [stat, tx(p, "stat_note") ? el("small", {text:tx(p, "stat_note")}) : null]) : null
    ]);
  }

  function pageBilim(){
    var list = sortedPosts().filter(function(p){ return st.postFilter === "all" || p.cat === st.postFilter; });
    var f = [["all", t("allCat")]].concat(Object.keys(T.uz.cats).map(function(k){ return [k, catName(k)]; }));
    return [page([
      el("div", {class:"bilim-head"}, [
        el("div", null, [el("h1", null, [t("kA"), " ", el("span", {class:"skew", text:t("kB")})]), el("p", {text:t("kP")})]),
        el("div", {class:"img", bg:"cover.jpg", role:"img", "aria-label":"Superior Grindset"})
      ]),
      el("div", {class:"filters"}, f.map(function(x){
        return el("button", {type:"button", "aria-pressed":String(st.postFilter === x[0]), text:x[1], onclick:function(){ st.postFilter = x[0]; render(); }});
      })),
      list.length ? el("div", {class:"plist"}, list.map(postRow)) : el("div", {class:"empty", text:t("noPosts")})
    ], 24)];
  }

  function pagePost(id){
    var p = DATA.posts.filter(function(x){ return String(x.id) === id; })[0];
    if (!p) return pageNotFound();
    var stat = tx(p, "stat");
    var kids = [
      el("a", {class:"back", href:"#/bilim", text:t("backK")}),
      el("div", {class:"meta", text:catName(p.cat) + " · " + fmtDate(p.date)}),
      el("h1", {text:tx(p, "title")})
    ];
    if (stat) kids.push(el("div", {class:"stat-hero"}, [el("b", {text:stat}), el("span", {text:tx(p, "stat_note")})]));
    kids.push(el("p", {class:"text", text:tx(p, "body")}));
    kids.push(askBox());
    return [page(kids, 22, "article")];
  }

  function pageNotFound(){
    return [page([el("div", {class:"empty"}, [t("notFound"), el("a", {href:"#/", text:t("toHome")})])])];
  }

  var lastKey = null;
  function render(){
    var r = route(), key = r.page + "/" + r.arg;
    if (key !== lastKey){ lastKey = key; window.scrollTo(0, 0); }
    var body;
    if (r.page === "mashqlar") body = pageMashqlar();
    else if (r.page === "m") body = pageMuscle(r.arg);
    else if (r.page === "ex") body = pageExercise(r.arg);
    else if (r.page === "bilim") body = pageBilim();
    else if (r.page === "post") body = pagePost(r.arg);
    else body = pageHome();
    var app = document.getElementById("app");
    app.replaceChildren.apply(app, [nav(r)].concat(body, [footer()]));
  }
  window.addEventListener("hashchange", render);

  window.addEventListener("message", function(ev){
    if (ev.origin !== "https://t.me") return;
    var d; try { d = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data; } catch(e){ return; }
    if (!d || d.event !== "resize" || !d.height) return;
    document.querySelectorAll("iframe.tg").forEach(function(f){ if (f.contentWindow === ev.source) f.style.height = d.height + "px"; });
  });

  document.documentElement.lang = LANG;
  fetch("data.json", {cache:"no-cache"}).then(function(r){ return r.json(); }).then(function(d){
    DATA = Object.assign(DATA, d);
    render();
  }).catch(function(){
    document.getElementById("app").replaceChildren(el("div", {class:"wrap loading"}, [t("loadErr")]));
  });
})();
</script>
</body>
</html>
